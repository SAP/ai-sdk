[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ai-sdk-gen"
version = "7.2.0"
description = "SAP Cloud SDK for AI (Python): generative AI SDK"
readme = "PYPIDESCRIPTION.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SAP SE" }]
keywords = ["SAP AI Core", "SAP generative AI SDK", "SAP Generative AI Hub"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 7",
    "Operating System :: Microsoft :: Windows :: Windows 8",
    "Operating System :: Microsoft :: Windows :: Windows 8.1",
    "Operating System :: Microsoft :: Windows :: Windows Server 2008",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "h11>=0.16.0",
    "dacite>=1.8.1",
    "click>=8.1.7",
    "overloading==0.5.0",
    "packaging>=23.2",
    "sap-ai-sdk-core>=3.3.0",
    "pydantic~=2.12",
    "openai>=1.66.0",
    "langcodes~=3.5.1",
    "pandas>=2.2.0",
    "langchain~=1.2.14",
    "langchain-classic~=1.0.0",
    "langchain-community~=0.4.1",
    "langchain-openai~=1.2.0",
]

[project.optional-dependencies]
google = ["google-genai~=1.73.1", "langchain-google-genai~=4.2.0"]
amazon = ["boto3>=1.40.61", "aiobotocore>=3.2.0", "langchain-aws~=1.4.0"]
all = ["sap-ai-sdk-gen[google,amazon]"]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.3.0",
    "pylint==4.0.5",
    "requests-mock==1.12.1",
    "respx==0.23.1",
    "parameterized==0.9.0",
    "pillow==12.2.0",
    "sphinx<9.0.0",
    "myst_nb",
    "sphinxawesome-theme",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
env_files = [".env"]

[project.urls]
Homepage = "https://www.sap.com/"
Download = "https://pypi.python.org/pypi/sap-ai-sdk-gen"

[tool.uv.sources]
sap-ai-sdk-core = { workspace = true }

[tool.setuptools.packages.find]
exclude = ["*test*"]

[tool.commitizen]
name = "cz_customize"
tag_format = "gen-v${version}"
ignored_tag_formats = ["*-v${version}"]
version_provider = "pep621"
changelog_file = "RELEASE_NOTES.md"

[tool.commitizen.customize]
bump_pattern = '^(feat|fix)\(gen\)'
changelog_pattern = '^(feat|fix)\(gen\)'
