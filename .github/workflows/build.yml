name: build

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # for review-dog comments
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Determine Changed Files
        id: changed-files
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          all_files=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '.files.[] | select(.additions > 0) | .path')
          changed_files="${all_files//$'\n'/,}"

          echo "[DEBUG] Following files have been changed: $changed_files"
          echo "changed-files=$changed_files" >> $GITHUB_OUTPUT

          docs_js_changed=$(gh pr view ${{ github.event.pull_request.number }} --json files --jq '[.files.[] | select(.path | startswith("docs-js/"))] | length')
          echo "docs-js-changed=$docs_js_changed" >> $GITHUB_OUTPUT
      - name: Vale Linter
        # vale fails if the PR is too large, e.g. when updating API docs
        if: ${{ github.event.pull_request.changed_files < 100 && steps.changed-files.outputs.changed-files != '' }}
        env:
          # Required
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          # version of 'vale' to use
          # see https://github.com/vale-cli/vale for all releases
          version: 3.17.1
          # changed files. computed in the step above
          files: ${{ steps.changed-files.outputs.changed-files }}
          # the separator for the file list. we are using a comma (see step above)
          separator: ","
          # let review dog fail if there are errors
          fail_on_error: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ubuntu-latest-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: ESlint and Prettier
        run: npm run lint
      - name: Check docs-js types
        if: ${{ steps.changed-files.outputs.docs-js-changed != '0' }}
        run: npm run check:docs-js-types

  build:
    runs-on: ubuntu-latest
    needs: [checks]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ubuntu-latest-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        run: npm ci
      - name: Build docs
        run: npm run build
