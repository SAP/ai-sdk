name: auto fix lint

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  fix-lint:
    if: github.event.pull_request.user.type != 'Bot' && !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read # all write operations use app token
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.SAP_AI_SDK_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SAP_AI_SDK_BOT_PRIVATE_KEY }}
          owner: SAP
          repositories: ai-sdk
          permission-pull-requests: write
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Install dependencies
        run: npm ci
      - run: npm run lint:fix
      - name: Suggest lint fixes if needed
        uses: reviewdog/action-suggester@fd22a83b1ebc13fd8aee5d57b06793fce6f20fb9 # v1.27.1
        with:
          tool_name: lint-fix
          fail_on_error: "false"
          github_token: ${{ steps.app-token.outputs.token }}
